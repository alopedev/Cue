name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Xcode 27 is only on GitHub's "xcode-27" image, still in preview.
    # Switch to a macos-27 label once GitHub makes it generally available.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode 27
        run: |
          XCODE="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run scripts/verify.sh
        run: scripts/verify.sh
